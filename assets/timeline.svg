<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
<defs>
<linearGradient id="line" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="820" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="0.6" stop-color="#818cf8"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#14122b"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:"Fira Code","DejaVu Sans Mono",Menlo,Consolas,monospace}
.t{font-size:13px;font-weight:700;fill:#e0e7ff}
.s{font-size:11px;fill:#8b8fc7}
.d{font-size:11px;fill:#a78bfa}
.track{stroke:#1e1b4b;stroke-width:4;fill:none}
.run{stroke:url(#line);stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:760;stroke-dashoffset:760;animation:draw 3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.n{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
.lab{opacity:0;animation:fade .8s ease-out forwards}
@keyframes fade{to{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(2.4);opacity:0}}
.next{stroke-dasharray:4 4;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.float{animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<rect width="900" height="240" rx="14" fill="url(#bg)" stroke="#312e81" stroke-width="1.5"/>
<text x="450" y="34" text-anchor="middle" class="t" style="font-size:15px">JOURNEY TIMELINE</text>

<path class="track" d="M80 120 H820"/>
<path class="run" d="M80 120 H820"/>

<g>
<circle class="n" cx="80" cy="120" r="10" fill="#a78bfa" filter="url(#glow)" style="animation-delay:.3s"/>
<g class="lab" style="animation-delay:.5s"><text x="80" y="82" text-anchor="middle" class="d">Fall 2025</text><text x="80" y="162" text-anchor="middle" class="t">Joined BS AI</text><text x="80" y="180" text-anchor="middle" class="s">Riphah Sahiwal</text></g>
</g>
<g>
<circle class="n" cx="228" cy="120" r="10" fill="#9b8cfb" filter="url(#glow)" style="animation-delay:.9s"/>
<g class="lab" style="animation-delay:1.1s"><text x="228" y="82" text-anchor="middle" class="d">GitHub</text><text x="228" y="162" text-anchor="middle" class="t">First repo shipped</text><text x="228" y="180" text-anchor="middle" class="s">open-source start</text></g>
</g>
<g>
<circle class="n" cx="376" cy="120" r="10" fill="#8b8ff5" filter="url(#glow)" style="animation-delay:1.5s"/>
<g class="lab" style="animation-delay:1.7s"><text x="376" y="82" text-anchor="middle" class="d">Foundations</text><text x="376" y="162" text-anchor="middle" class="t">Python + DSA</text><text x="376" y="180" text-anchor="middle" class="s">C++ &amp; SQL too</text></g>
</g>
<g>
<circle class="n" cx="524" cy="120" r="10" fill="#7aa0f5" filter="url(#glow)" style="animation-delay:2.1s"/>
<circle class="pulse" cx="524" cy="120" r="10" fill="#38bdf8" style="animation-delay:2.7s"/>
<g class="lab" style="animation-delay:2.3s"><text x="524" y="82" text-anchor="middle" class="d">Now</text><text x="524" y="162" text-anchor="middle" class="t">Machine Learning</text><text x="524" y="180" text-anchor="middle" class="s">in progress</text></g>
<g class="float"><path d="M524 100 l-6 -9 h12 z" fill="#38bdf8"/></g>
</g>
<g>
<circle class="n" cx="672" cy="120" r="10" fill="#0d1117" stroke="#818cf8" stroke-width="2.5" style="animation-delay:2.7s"/>
<g class="lab" style="animation-delay:2.9s"><text x="672" y="82" text-anchor="middle" class="d">Up next</text><text x="672" y="162" text-anchor="middle" class="t">Deep Learning</text><text x="672" y="180" text-anchor="middle" class="s">PyTorch / TF</text></g>
</g>
<g>
<circle class="n" cx="820" cy="120" r="10" fill="#0d1117" stroke="#38bdf8" stroke-width="2.5" style="animation-delay:3.1s"/>
<g class="lab" style="animation-delay:3.3s"><text x="820" y="82" text-anchor="middle" class="d">Goal</text><text x="820" y="162" text-anchor="middle" class="t">AI Engineer</text><text x="820" y="180" text-anchor="middle" class="s">build what matters</text></g>
</g>
<text x="450" y="222" text-anchor="middle" class="s">learning &#8226; building &#8226; shipping</text>
</svg>
